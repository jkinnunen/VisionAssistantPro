summary = "Vision Assistant Pro"
description = """مساعد ذكاء اصطناعي متقدم لـ NVDA باستخدام نماذج Gemini.
طبقة الأوامر: اضغط NVDA+Shift+V، ثم:
- المترجم الذكي (T) / الحافظة (Shift+T)
- محسّن النص (R)
- وصف الكائن (V) / الشاشة الكاملة (O)
- تحليل الفيديو (Shift+V)
- تسجيل الفيديو المحلي (Control+V)
- قارئ المستندات (D)
- التعرف على النص من الملفات (F)
- حل الكابتشا (C)
- دردشة مباشرة (Shift+C)
- تفريغ الوسائط والدبلجة (M)
- الإملاء الذكي (S)
        - الترجمة الصوتية (Control+T)
- الإعلان عن الحالة (I)
- تسمية الكائن (L)
- إدارة/مسح التسميات (Shift+L)
- مستكشف واجهة المستخدم (E)
- مُشغّل الذكاء الاصطناعي (Shift+A)
- التحقق من التحديث (U)
- استدعاء آخر نتيجة (Space)
- تعليمات الأوامر (H)
- فتح الإعدادات (Alt+S)
- الإبلاغ عن المفاتيح المستنفدة (Alt+Q)
- الإبلاغ عن التوجيه المتقدم (Alt+M)
- الإعدادات السريعة (أعلى/أسفل/يسار/يمين)"""
changelog = """## التغييرات في 2026.08.06

*   **تسمية مستكشف واجهة المستخدم**: يمكنك الآن إضافة تسميات مباشرة إلى العناصر التي تم العثور عليها داخل مستكشف واجهة المستخدم! تمت إضافة زر "إضافة تسمية" جديد، وتظل الواجهة مفتوحة بذكاء وتحافظ على التركيز بحيث يمكنك تسمية كائنات متعددة بسرعة دون انقطاع.
*   **تحسين طبقة الإعدادات السريعة**: أصبحت طبقة Vision Assistant (`Insert+Shift+V`) دائمة وتفاعلية للغاية! يمكنك استخدام الأسهم `أعلى/أسفل` للتنقل بين الإعدادات السريعة (المزود، النموذج، لغة رد الذكاء الاصطناعي، نموذج TTS) والأسهم `يسار/يمين` لتغيير قيمها فورًا مع ردود صوتية ذكية وموجزة. يتم تطبيق اختياراتك على الفور (بما في ذلك التفعيل التلقائي للتوجيه المتقدم عند الحاجة)، وتبقى الطبقة نشطة أثناء التكوين.
*   **الدردشة المباشرة (`Shift+C`)**: تمت إضافة أمر جديد إلى الطبقة! اضغط `Shift+C` لفتح نافذة "دردشة مباشرة" فورًا. يوفر هذا واجهة محادثة نصية نظيفة مع الذكاء الاصطناعي مباشرة، دون الحاجة إلى صورة أو مستند كنقطة بداية.
*   **استدعاء سجل المحادثة بشكل مثالي**: تم إصلاح خطأ رئيسي حيث كان الضغط على مفتاح `المسافة` لاستدعاء آخر نتيجة يفقد سجل المحادثة اللاحق. الآن، تتتبع الإضافة محادثتك عالميًا. إذا تحدثت وأغلقت النافذة وضغطت مفتاح `المسافة` لاستدعائها، فسيتم استعادة سجل المحادثة الكامل بشكل مثالي! يعمل للدردشة المباشرة وتحليل الرؤية ودردشة المستندات والترجمة.
*   **وصف الصور ضمن النص أثناء OCR**: تمت إضافة ميزة اختيارية لوصف الصور ضمن النص أثناء التعرف على النص (OCR) للمستندات. يمكنك تبديل هذا الإعداد في إعدادات OCR للإضافة، ضمن خيارات قارئ المستندات قبل الاستخراج، وبسرعة أثناء العمل عبر طبقة الإعدادات السريعة.
*   **الترجمة الصوتية (`Control+T`)**: تمت إضافة ميزة قوية جديدة! أمِل صوتك وترجم فورًا واكتب باستخدام الذكاء الاصطناعي بناءً على لغتي المصدر والهدف اللتين قمت بتكوينهما.
*   **تحسينات منزّل التحديثات**: تعرض نافذة تنزيل التحديث الآن تقدم التنزيل بالنسبة المئوية بشكل صحيح، وتم إصلاح خطأ ظهور رسالة "جارٍ تنزيل التحديث" الوهمية عند إلغاء التثبيت.
*   **تحسينات منزّل eSpeak-NG**: تمت إضافة تتبع التقدم بالنسبة المئوية لتنزيلات eSpeak-NG.
*   **مرونة OCR الدفعي**: تم إصلاح مشكلة في OCR الدفعي لملفات PDF حيث تتوقف العملية إذا بلغ مفتاح API النشط حصته في منتصف العمل؛ الآن يتحول تلقائيًا إلى المفتاح التالي المتاح ويستأنف العملية.
*   **دعم الكابتشا المرئية**: تمت إضافة دعم قوي لحل الكابتشا المرئية. يحاول حل تحديات الصور المعقدة مثل hCaptcha وreCAPTCHA تلقائيًا، مما يعزز بشكل كبير إمكانية الوصول في نماذج الويب الصعبة.
*   **إعادة بناء التفريغ الصوتي**: تمت إعادة بناء وحدة التفريغ الصوتي بالكامل وهي تدعم الآن ملفات الصوت والفيديو. تتميز بثلاثة أوضاع تشغيل متميزة: "تفريغ (اللغة الأصلية)"، "تفريغ وترجمة (اللغة الهدف)"، وخيار "دبلجة وترجمة (اللغة الهدف)" الجديد القوي (حصري لـ Gemini) الذي يولّد دبلجة صوتية مترجمة للكلام الأصلي.
*   **أرقام صفحات اختيارية في قارئ المستندات**: تمت إضافة إعداد جديد لتبديل تضمين أرقام الصفحات والفواصل في مخرجات المستندات متعددة الصفحات. يمكنك إدارة هذا الخيار بسهولة من الإعدادات الرئيسية أو تبديله أثناء العمل عبر طبقة الإعدادات السريعة. تنطبق هذه الميزة على تصدير ملفات النص/HTML ونافذة "عرض منسق" المضمنة، مما يسمح لك بقراءة المستندات المجمعة بسلاسة.
*   **Gemini Live TTS غير محدود لأوصاف الفيديو**: يمكنك الآن تحديد "Gemini Live TTS" كمحرك صوتي عند توليد السرد الصوتي المتزامن (MP3) للفيديوهات. يستخدم هذا Gemini Live API لتوليف أوصاف صوتية عالية الجودة دون أي حدود للأحرف أو قيود على الطول.
*   **نمذجة الكود**: تمت إعادة هيكلة بنية الإضافة من ملف واحد إلى بنية معيارية متعددة الملفات لتحسين قابلية الصيانة.
*   **إعادة تصميم واجهة الإعدادات**: تمت إعادة تصميم نافذة الإعدادات بالكامل لاستخدام واجهة حديثة قائمة على التبويبات بدلاً من التخطيط المجمع، مما يوفر تنظيمًا أفضل وتنقلاً أسهل مع الحفاظ على جميع الخيارات الحالية.
*   **تسجيل الملفات العام والمخصص**: تمت إضافة نظام تسجيل ملفات عام اختياري ضمن تبويب الإعدادات "المتقدم" الجديد. يلتقط تلقائيًا الأحداث التشغيلية وحركة مرور API والأخطاء عبر جميع وحدات الإضافة في ملف مخصص (`vision_assistant.log`). يدعم مستويات تفصيل قابلة للتكوين (تصحيح، معلومات، تحذير، خطأ)، وفترات احتفاظ تلقائية (من ساعة واحدة إلى 90 يومًا)، وفتح السجل أو مسحه مباشرة من الإعدادات دون أي تأثير على الأداء أو تداخل مع سجل NVDA.
*   **تتبع تقدم رفع Gemini**: تمت إضافة إعلانات تقدم بالنسبة المئوية في الوقت الفعلي عند رفع الملفات الكبيرة (الفيديو والصوت والمستندات) إلى Google Gemini API."""
